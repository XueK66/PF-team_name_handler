name: Release Team Name Handler

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Create package
        run: |
          mkdir -p dist
          zip -r dist/team_name_handler-${{ github.ref_name }}.mcdr src

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/team_name_handler-${{ github.ref_name }}.mcdr

  release:
    needs: package
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: package

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: team_name_handler-${{ github.ref_name }}.mcdr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}